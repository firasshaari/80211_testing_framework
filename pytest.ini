[pytest]
addopts = -v --tb=short
testpaths = tests/

markers =
    # ── Capability markers (evaluated by skip hook in conftest.py) ──────────
    requires_lanforge: needs LANforge hardware
    requires_rpi5: needs RPi5 traffic engines
    requires_two_endpoints: needs any two-endpoint traffic setup (LANforge OR RPi5)
    requires_multi_sta: needs MT7915-type multi-STA radio
    requires_wifi7: needs WiFi 7 radio (BE200 or MT7996)
    requires_sixghz: needs a 6 GHz capable radio
    requires_min_stations: needs at least N total STA capacity
    requires_radius: needs FreeRADIUS on infra box
    requires_vlan: needs VLAN-capable infra

    # ── Test category markers ────────────────────────────────────────────────
    rate_limiting: rate limit enforcement tests
    connectivity: basic association and IP connectivity tests
    capacity: multi-STA load tests
    performance: peak throughput tests
    enterprise: 802.1X / EAP authentication tests
    multi_vlan: VLAN isolation and tagging tests

    # ── Security markers ─────────────────────────────────────────────────────
    open: open (no security)
    wpa2_personal: WPA2-Personal (PSK2)
    wpa3_personal: WPA3-Personal (SAE)
    wpa3_personal_mixed: WPA3-Personal Mixed (SAE-Mixed)
    wpa_wpa2_personal_mixed: WPA/WPA2 Mixed Personal
    wpa2_enterprise: WPA2-Enterprise (EAP)
    wpa3_enterprise: WPA3-Enterprise
    owe: OWE (Opportunistic Wireless Encryption)

    # ── Mode markers ─────────────────────────────────────────────────────────
    bridge: bridge mode
    nat: NAT mode
    vlan: VLAN mode

    # ── Band markers ─────────────────────────────────────────────────────────
    twog: 2.4 GHz band
    fiveg: 5 GHz band
    sixg: 6 GHz band

    # ── Traffic direction markers ─────────────────────────────────────────────
    upstream: upstream (client → server) traffic
    downstream: downstream (server → client) traffic
    bidirectional: bidirectional traffic
