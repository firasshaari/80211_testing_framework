[pytest]
addopts = -v --tb=short --strict-markers
testpaths = tests/

markers =
    # ── Feature areas — mirror framework.examples.catalog.Area ──────────────
    security: authentication and encryption methods
    network_mode: bridge vs NAT forwarding behaviour
    rate_limit: per-SSID and per-client shaping
    qos: quality of service and WMM classification
    roaming: 802.11k/r/v, steering and RRM
    captive: captive portal flows
    vlan: VLAN tagging and segmentation
    tunnel: GRE, VXLAN, mesh and WDS
    services: on-AP services (SSH, LLDP, NTP, admin UI)
    telemetry: statistics, health and client fingerprinting
    switch: managed switch fabric
    wifi_gen: 6 GHz and Wi-Fi 7 operation
    wwan: cellular uplink

    # ── Sweep selection ─────────────────────────────────────────────────────
    regression: part of the standard regression sweep
    config_only: applies a config with no station involved

# Hardware requirements are NOT markers — they are checked against probed
# capabilities at runtime so a skip can name the missing resource.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
