[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "80211-testing-framework"
version = "0.2.0"
description = "Capability-aware OpenWiFi AP regression framework (direct SSH, no cloud SDK)"
requires-python = ">=3.10"
dependencies = [
    # Test runner + reporting
    "pytest>=8.0",
    "allure-pytest>=2.13",

    # SSH to the AP and the RPi5 station
    "paramiko>=3.4",

    # Config validation
    "pydantic>=2.0",
    "pyyaml>=6.0",

    # Utilities
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
console = [
    # Bench Console — the web UI on the station. Kept optional so a laptop
    # checkout that only runs sweeps does not need a web stack.
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]
dev = [
    "pytest-xdist",       # parallel test execution
    "pytest-timeout",     # per-test timeout
    "black",              # formatter
    "ruff",               # linter
    "mypy",               # type checker
]

[tool.setuptools.packages.find]
where = ["."]
include = ["framework*", "benchd*"]

[tool.setuptools.package-data]
benchd = ["templates/*.html", "static/*", "deploy/*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
