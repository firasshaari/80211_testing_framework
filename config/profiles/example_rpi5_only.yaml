# Example testbed profile — RPi5 only (no LANforge)
# Suitable for: connectivity, rate_limiting tests

testbed:
  name: "rpi5-bench"
  description: "EAP101 + 2x RPi5 BE200, no LANforge"

ap:
  serial: "7c273c62de74"
  serial_port: null                   # No serial console in this config

controller:
  base_url: "https://your-controller:16002"
  username: "admin@example.com"
  password: "CHANGE_ME"
  verify_ssl: false

# lanforge: not present → framework automatically uses RPi5 engine

rpi5:
  hosts:
    - host: "192.168.1.60"
      user: "pi"
      key_path: "~/.ssh/lab_rpi5"
      role: "client"
      wifi_iface: "wlan0"
    - host: "192.168.1.61"
      user: "pi"
      key_path: "~/.ssh/lab_rpi5"
      role: "server"
      wifi_iface: "wlan0"

infra:
  host: "192.168.1.1"
  user: "root"
  key_path: "~/.ssh/lab_infra"
  parent_iface: "eth0"
  dnsmasq_conf_dir: "/etc/dnsmasq.d"
  freeradius_conf_dir: "/etc/freeradius/3.0"
  services:
    dhcp: "dnsmasq"
    radius: "freeradius"

# ── Pre-configured network resources ──────────────────────────────────────────
# This testbed has no managed infra box, so all network resources must be
# declared here.  Tests use testbed_config.network.get_vlan(id=10) to look
# up a VLAN, or caps.vlans to iterate all available VLANs.
#
# network:
#   management_subnet: "192.168.1.0/24"
#
#   vlans:
#     - id: 10
#       name: "corp"
#       subnet: "192.168.10.0/24"
#       gateway: "192.168.10.1"
#       dhcp_range: ["192.168.10.100", "192.168.10.200"]
#
#     - id: 20
#       name: "guest"
#       subnet: "192.168.20.0/24"
#       gateway: "192.168.20.1"
#       dhcp_range: ["192.168.20.100", "192.168.20.200"]
#
#   radius:
#     host: "192.168.1.5"
#     auth_port: 1812
#     acct_port: 1813
#     secret: "${RADIUS_SECRET}"

settings:
  association_timeout: 30
  traffic_duration_s: 30
  allure_results_dir: "allure-results"
  log_level: "INFO"
