# Example testbed profile — LANforge with MT7915 + BE200 radios
# Copy to config/testbed.yaml and fill in your values.
# config/testbed.yaml is gitignored (contains credentials).

testbed:
  name: "lab-bench-01"
  description: "EAP101 + LANforge MT7915/BE200"

ap:
  serial: "7c273c62de74"              # AP serial number
  serial_port: "/dev/ttyUSB0"         # Serial console on LANforge host

controller:
  base_url: "https://your-controller:16002"
  username: "admin@example.com"
  password: "CHANGE_ME"               # or use ${UCENTRAL_PASSWORD} env var
  verify_ssl: false

lanforge:
  host: "192.168.1.50"
  port: 8080
  # Override chipset names if LANforge reports generic strings
  radio_overrides:
    "wiphy0": "MT7915"
    "wiphy1": "MT7915"
    "wiphy2": "BE200"
    "wiphy3": "BE200"

# rpi5:                               # Uncomment if RPi5s are available
#   hosts:
#     - host: "192.168.1.60"
#       user: "pi"
#       key_path: "~/.ssh/lab_rpi5"
#       role: "client"
#       wifi_iface: "wlan0"
#     - host: "192.168.1.61"
#       user: "pi"
#       key_path: "~/.ssh/lab_rpi5"
#       role: "server"
#       wifi_iface: "wlan0"

infra:
  host: "192.168.1.1"
  user: "root"
  key_path: "~/.ssh/lab_infra"
  parent_iface: "eth0"
  dnsmasq_conf_dir: "/etc/dnsmasq.d"
  freeradius_conf_dir: "/etc/freeradius/3.0"
  services:
    dhcp: "dnsmasq"
    radius: "freeradius"

# ── Pre-configured network resources ──────────────────────────────────────────
# Use this block when VLANs, DHCP, and RADIUS already exist on the network and
# the framework should use them as-is rather than creating/managing them.
# If the `infra:` block is also present, it takes over dynamic management;
# the `network:` block is used for static lookups by tests.
#
# To use ONLY pre-configured resources (no infra management), remove or
# comment out the `infra:` block above and populate this block instead.
#
# network:
#   management_subnet: "192.168.1.0/24"
#
#   vlans:
#     - id: 10
#       name: "corp"
#       subnet: "192.168.10.0/24"
#       gateway: "192.168.10.1"
#       dhcp_range: ["192.168.10.100", "192.168.10.200"]
#       dns: "8.8.8.8"
#       interface: "eth0.10"     # optional — sub-iface on infra/router box
#
#     - id: 20
#       name: "guest"
#       subnet: "192.168.20.0/24"
#       gateway: "192.168.20.1"
#       dhcp_range: ["192.168.20.100", "192.168.20.200"]
#
#     - id: 30
#       name: "iot"
#       subnet: "192.168.30.0/24"
#       gateway: "192.168.30.1"
#
#   radius:
#     host: "192.168.1.5"
#     auth_port: 1812
#     acct_port: 1813
#     secret: "${RADIUS_SECRET}"   # expand from env var, or put literal value

settings:
  association_timeout: 30
  traffic_duration_s: 30
  allure_results_dir: "allure-results"
  log_level: "INFO"
